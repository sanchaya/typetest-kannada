name: Sync to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Validate inline script and structure
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            const m = html.match(/<script>([\s\S]*)<\/script>/);
            if (!m) { console.error('FAIL: inline <script> block not found'); process.exit(1); }
            fs.writeFileSync('app.inline.js', m[1]);
            for (const [name, needle] of Object.entries({
              'CSP meta tag': 'Content-Security-Policy',
              'esc() escape helper': 'function esc(',
              'safeUrl() href guard': 'function safeUrl(',
              'CDN fallback helper': 'function cdnFallbackUrl(',
              'html2canvas lazy-load': 'ensureHtml2Canvas',
            })) {
              if (!html.includes(needle)) { console.error('FAIL: missing ' + name); process.exit(1); }
            }
            console.log('structural checks passed');
          "
          node --check app.inline.js
          node --check .github/workflows/sync-pages.yml 2>/dev/null || true

  sync:
    runs-on: ubuntu-latest
    needs: check
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Sync to gh-pages
        run: |
          git config user.name "sanchaya-bot"
          git config user.email "noreply@github.com"
          git checkout -b gh-pages origin/gh-pages
          git merge main --no-edit --strategy-option theirs
          git push origin gh-pages
